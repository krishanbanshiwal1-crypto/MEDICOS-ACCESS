<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;color:#16304d;background:#f7fbff}
a{text-decoration:none}
.container{width:92%;max-width:1150px;margin:auto}

/* NAV */
nav{
position:fixed;top:0;width:100%;z-index:10;
background:rgba(255,255,255,.92);backdrop-filter:blur(15px);

}
.nav{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:900;color:#071a33}
.logo span{color:#087cff}
.logo-icon{
display:inline-grid;place-items:center;width:38px;height:38px;
margin-right:8px;border-radius:12px;color:white;
background:linear-gradient(135deg,#087cff,#15c9ff)
}
.links{display:flex;gap:25px;align-items:center}
.links a{color:#52677e;font-size:14px;font-weight:bold}
.navbtn{background:#071a33!important;color:white!important;padding:11px 17px;border-radius:10px}

/* HERO */
.hero{
padding:145px 0 90px;

}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.badge{
display:inline-block;padding:8px 13px;border-radius:30px;
background:#e5f4ff;color:#087cff;font-size:11px;font-weight:bold;
margin-bottom:18px
}
h1{font-size:58px;line-height:1.03;color:#071a33;letter-spacing:-2px}
h1 span{color:#087cff}
.hero p{font-size:16px;color:#6d7d91;line-height:1.8;margin:22px 0 28px;max-width:580px}
.buttons{display:flex;gap:12px;flex-wrap:wrap}
.btn{
display:inline-block;padding:14px 20px;border-radius:12px;
font-weight:bold;font-size:14px
}
.primary{background:#087cff;color:white;box-shadow:0 12px 25px #087cff33}
.secondary{background:white;color:#071a33;border:1px solid #dce8f3}

/* DASHBOARD */

}
