<!-- MEDICOS ACCESS - BOT + WHATSAPP REDIRECTS -->
<script>
const MEDICOS_BOT = "https://t.me/Medicos_Accessbot";
const WHATSAPP_CHANNEL = "https://whatsapp.com/channel/0029VbDbCHv9Gv7UTFIrVa1l";

function openMedicosBot(section = "") {
    let link = MEDICOS_BOT;

    if (section) {
        link += "?text=" + encodeURIComponent(
            "Hello Medicos_Access, I want information about: " + section
        );
    }

    window.open(link, "_blank");
}

/* Make these sections open the Telegram Bot */
document.addEventListener("DOMContentLoaded", function () {

    const botSections = [
        "Notes",
        "PYQ",
        "Test Series",
        "Study Material",
        "Ebooks",
        "Mock Tests",
        "Previous Year Questions",
        "NORCET"
    ];

    document.querySelectorAll("a, button, .feature-card, .study-card").forEach(function (element) {

        const text = element.innerText.trim().toLowerCase();

        botSections.forEach(function (section) {

            if (text.includes(section.toLowerCase())) {

                element.style.cursor = "pointer";

                element.addEventListener("click", function (e) {

                    /* Don't redirect an already-working external link */
                    if (
                        element.tagName === "A" &&
                        element.getAttribute("href") &&
                        element.getAttribute("href") !== "#"
                    ) {
                        return;
                    }

                    e.preventDefault();
                    openMedicosBot(section);
                });

            }
        });
    });

    /* Add WhatsApp button automatically inside Contact section */
    const contact = document.querySelector("#contact");

    if (contact && !contact.querySelector(".whatsapp-channel-btn")) {

        const whatsappBtn = document.createElement("a");

        whatsappBtn.href = WHATSAPP_CHANNEL;
        whatsappBtn.target = "_blank";
        whatsappBtn.rel = "noopener noreferrer";
        whatsappBtn.className = "btn whatsapp-channel-btn";

        whatsappBtn.innerHTML = "🟢 Join WhatsApp Channel →";

        whatsappBtn.style.display = "inline-block";
        whatsappBtn.style.marginTop = "10px";

        contact.appendChild(whatsappBtn);
    }
});
</script>
